
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: contractlens-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: contractlens
      POSTGRES_PASSWORD: contractlens
      POSTGRES_DB: contractlens
    ports:
      # Bound to loopback ONLY. "5432:5432" would publish the database on every
      # network interface, letting anyone on the same Wi-Fi/LAN connect with the
      # default credentials below.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contractlens"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
